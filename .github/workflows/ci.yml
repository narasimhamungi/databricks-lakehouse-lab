name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Spark 4 needs Java 17 or later.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # delta-spark fetches the Delta jars from Maven Central on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-delta-4.0.0-spark-4.0.1

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # REQUIRE_DELTA=1 turns "Delta jars missing" into a failure instead of
      # skipped tests, so the MERGE, SCD-2 and time-travel tests always run here.
      - name: Test
        env:
          REQUIRE_DELTA: "1"
        run: pytest -v
